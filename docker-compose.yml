# Full stack in one container (Next on $PORT, FastAPI on 127.0.0.1:8000).
# Create backend/.env for API keys (see backend/.env.example), then:
#
#   docker compose up --build
#
# Open http://localhost:3000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_URL: "http://127.0.0.1:8000"
    env_file:
      - ./backend/.env
