# Local / server: API only. Run the Next.js app separately (npm run dev)
# so NEXT_PUBLIC_* can point at this service.
#
#   docker compose up --build
#   cd frontend && NEXT_PUBLIC_API_URL=http://127.0.0.1:8000 npm run dev
#
# Create backend/.env first (see .env.example).

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
