# DigitalOcean App Platform — single service (Next.js + FastAPI in one container).
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Build context: repository root (Dockerfile + frontend/ + backend/).

name: vc-analyst-ai
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED

services:
  - name: app
    source_dir: /
    github:
      repo: danish-safdariyan/vc-analyst
      branch: feature/digitalocean-unified-container
      deploy_on_push: true
    dockerfile_path: Dockerfile
    # Next.js listens on PORT; default 3000 locally. DO sets PORT — keep http_port in sync.
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 45
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: USE_MOCK
        scope: RUN_TIME
        value: "false"
      # Force Next /api proxy to same-container FastAPI (ignore mistaken public BACKEND_URL).
      - key: UNIFIED_CONTAINER
        scope: RUN_TIME
        value: "1"
      # Next server-side proxy must use loopback (see INTERNAL_FASTAPI_URL in Dockerfile / backend-origin.ts).
      - key: INTERNAL_FASTAPI_URL
        scope: RUN_TIME
        value: "http://127.0.0.1:8000"
      - key: BACKEND_URL
        scope: RUN_TIME
        value: "http://127.0.0.1:8000"
      - key: NEXT_PUBLIC_DEMO_MODE
        scope: BUILD_TIME
        value: "false"
