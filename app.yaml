# DigitalOcean App Platform — root app spec (some UI flows only scan this file).
# Prefer editing .do/app.yaml and keeping this in sync, or delete one copy.
#
# GitHub repo must match YOUR account (replace below).

name: vc-analyst-ai
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED

services:
  - name: api
    source_dir: backend
    github:
      repo: danish-safdariyan/vc-analyst
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: USE_MOCK
        scope: RUN_TIME
        value: "false"

  - name: web
    source_dir: frontend
    github:
      repo: danish-safdariyan/vc-analyst
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        type: GENERAL
        value: ${api.PUBLIC_URL}
      - key: NEXT_PUBLIC_DEMO_MODE
        scope: BUILD_TIME
        value: "false"
